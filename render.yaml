services:
  - type: web
    name: yaniv-cafe
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /version
    disk:
      name: yaniv-profiles
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
